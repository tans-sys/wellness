<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BHCI Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;
  --surface:#fff;
  --blue:#185FA5;
  --blue-light:#378ADD;
  --blue-pale:#B5D4F4;
  --blue-wash:#E6F1FB;
  --dark:#042C53;
  --muted:#6B8CAE;
  --green:#1D9E75;
  --amber:#BA7517;
  --red:#E24B4A;
  --border:#DDE6F0;
  --radius:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}

/* LOGIN */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.login-card{
  background:var(--surface);border-radius:20px;
  padding:40px 32px;width:100%;max-width:380px;
  box-shadow:0 4px 24px rgba(4,44,83,.1);
  display:flex;flex-direction:column;gap:18px;align-items:center;
}
.login-logo{font-size:36px}
.login-title{font-size:22px;font-weight:800;color:var(--dark)}
.login-sub{font-size:14px;color:var(--muted);text-align:center}
.login-input{
  width:100%;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:12px;font-size:16px;color:var(--dark);
  background:var(--bg);outline:none;transition:border-color .15s;
}
.login-input:focus{border-color:var(--blue)}
.login-btn{
  width:100%;padding:15px;background:var(--blue);color:#fff;
  border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;
}
.login-btn:active{opacity:.88}
.login-err{color:var(--red);font-size:13px;display:none}

/* DASHBOARD */
#dash{display:none;flex-direction:column;min-height:100vh}

/* HEADER */
.hdr{
  background:var(--dark);color:#fff;
  padding:18px 28px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
  position:sticky;top:0;z-index:10;
}
.hdr-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.hdr-title span{font-size:22px}
.hdr-right{display:flex;align-items:center;gap:14px}
.refresh-btn{
  padding:8px 18px;background:rgba(255,255,255,.12);
  color:#fff;border:1px solid rgba(255,255,255,.2);
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
}
.refresh-btn:active{opacity:.8}
.logout-btn{
  padding:8px 18px;background:transparent;
  color:rgba(255,255,255,.6);border:none;
  font-size:13px;cursor:pointer;
}

/* MAIN */
.main{padding:24px 24px 48px;max-width:1100px;margin:0 auto;width:100%}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.stat-card{
  background:var(--surface);border-radius:var(--radius);
  padding:20px 22px;border:1px solid var(--border);
}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-value{font-size:34px;font-weight:800;color:var(--dark);line-height:1}
.stat-sub{font-size:13px;color:var(--muted);margin-top:4px}
.stat-card.green .stat-value{color:var(--green)}
.stat-card.blue .stat-value{color:var(--blue)}
.stat-card.amber .stat-value{color:var(--amber)}
.stat-card.red .stat-value{color:var(--red)}

/* SECTION */
.section-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--radius);padding:22px;border:1px solid var(--border)}

/* BANDS */
.band-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.band-row:last-child{border-bottom:none}
.band-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.band-name{flex:1;font-size:14px;font-weight:600;color:var(--dark)}
.band-count{font-size:14px;font-weight:700;color:var(--blue)}
.band-pct{font-size:12px;color:var(--muted);min-width:36px;text-align:right}
.band-bar-wrap{flex:2;height:8px;background:var(--bg);border-radius:10px;overflow:hidden}
.band-bar{height:100%;border-radius:10px;transition:width .4s}

/* TREND CHART */
.chart-wrap{position:relative;height:160px;margin-top:8px}
canvas{width:100%!important}

/* QUESTION BARS */
.q-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.q-label{font-size:12px;color:var(--dark);min-width:148px;font-weight:500;flex-shrink:0}
.q-bar-wrap{flex:1;height:10px;background:var(--bg);border-radius:10px;overflow:hidden}
.q-bar{height:100%;border-radius:10px;transition:width .4s}
.q-pct{font-size:12px;color:var(--muted);min-width:36px;text-align:right;font-weight:600}

/* SCORE DIST */
.score-bar-row{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:12px}
.score-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.score-bar-inner{width:100%;background:var(--blue-light);border-radius:4px 4px 0 0;min-height:2px;transition:height .4s}
.score-col-label{font-size:9px;color:var(--muted)}

/* RECENT TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--dark)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:var(--blue-wash);color:var(--green)}
.badge-amber{background:#FEF3E0;color:var(--amber)}
.badge-red{background:#FCEBEB;color:var(--red)}

/* LOADING */
.loading{text-align:center;padding:48px;color:var(--muted);font-size:15px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧠</div>
    <div class="login-title">Admin Dashboard</div>
    <div class="login-sub">Brain Health Check-In · Analytics</div>
    <input class="login-input" type="password" id="pw-input" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div class="login-err" id="login-err">Incorrect password. Please try again.</div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash">
  <div class="hdr">
    <div class="hdr-title"><span>🧠</span> BHCI Admin Dashboard</div>
    <div class="hdr-right">
      <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="loading">Loading data…</div>
  </div>
</div>

<script>
let adminPw = '';

function doLogin(){
  const pw = document.getElementById('pw-input').value.trim();
  if(!pw) return;
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){
        adminPw = pw;
        document.getElementById('login-screen').style.display='none';
        document.getElementById('dash').style.display='flex';
        document.getElementById('dash').style.flexDirection='column';
        loadStats();
      } else {
        document.getElementById('login-err').style.display='block';
      }
    }).catch(()=>{ document.getElementById('login-err').style.display='block'; });
}
function logout(){
  adminPw='';
  document.getElementById('dash').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
}

function loadStats(){
  document.getElementById('main-content').innerHTML='<div class="loading">Loading data…</div>';
  fetch('/api/admin/stats',{headers:{'x-admin-password':adminPw}})
    .then(r=>r.json()).then(renderDash)
    .catch(()=>{ document.getElementById('main-content').innerHTML='<div class="loading">Failed to load. Check server.</div>'; });
}

function bandColor(band){
  if(!band) return '#BDBDBD';
  if(band.toLowerCase().includes('flourish')) return '#1D9E75';
  if(band.toLowerCase().includes('pressure')) return '#BA7517';
  return '#E24B4A';
}
function bandBadge(band){
  if(!band) return '';
  if(band.toLowerCase().includes('flourish')) return 'badge-green';
  if(band.toLowerCase().includes('pressure')) return 'badge-amber';
  return 'badge-red';
}

function makeTrendSVG(visitData, submitData){
  // Build a simple SVG line chart
  const allDays=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    allDays.push(d.toISOString().slice(0,10));
  }
  const vMap=Object.fromEntries(visitData.map(r=>[r.day,r.count]));
  const sMap=Object.fromEntries(submitData.map(r=>[r.day,r.count]));
  const vVals=allDays.map(d=>vMap[d]||0);
  const sVals=allDays.map(d=>sMap[d]||0);
  const maxV=Math.max(...vVals,1);

  const W=500,H=120,padL=8,padR=8,padT=10,padB=28;
  const w=W-padL-padR, h=H-padT-padB;
  const xStep=w/(allDays.length-1);

  function pts(vals,max){ return vals.map((v,i)=>`${padL+i*xStep},${padT+h-(v/max)*h}`).join(' '); }

  const vPts=pts(vVals,maxV);
  const sPts=pts(sVals,maxV);

  // x-axis labels (every 7 days)
  const labels=allDays.map((d,i)=>{
    if(i%7!==0 && i!==allDays.length-1) return '';
    return `<text x="${padL+i*xStep}" y="${H-6}" text-anchor="middle" font-size="9" fill="#6B8CAE">${d.slice(5)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:140px">
    <polyline points="${vPts}" fill="none" stroke="#378ADD" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${sPts}" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 2"/>
    ${vVals.map((v,i)=>`<circle cx="${padL+i*xStep}" cy="${padT+h-(v/maxV)*h}" r="3" fill="#378ADD"/>`).join('')}
    ${sVals.map((v,i)=>`<circle cx="${padL+i*xStep}" cy="${padT+h-(v/maxV)*h}" r="3" fill="#1D9E75"/>`).join('')}
    ${labels}
    <text x="8" y="12" font-size="9" fill="#378ADD" font-weight="600">— Visits</text>
    <text x="60" y="12" font-size="9" fill="#1D9E75" font-weight="600">- - Submissions</text>
  </svg>`;
}

function renderDash(d){
  const completion = d.totalVisits>0 ? Math.round((d.totalSubmissions/d.totalVisits)*100) : 0;

  // Score distribution bars
  const scoreMap=Object.fromEntries(d.scoreDist.map(r=>[r.total_score,r.count]));
  const maxScore=Math.max(...Object.values(scoreMap),1);
  const scoreCols=Array.from({length:16},(_,i)=>{
    const c=scoreMap[i]||0;
    const h=Math.round((c/maxScore)*70);
    const col = i<=4?'#1D9E75': i<=9?'#BA7517':'#E24B4A';
    return `<div class="score-col">
      <div class="score-bar-inner" style="height:${h}px;background:${col}" title="${c} submissions"></div>
      <div class="score-col-label">${i}</div>
    </div>`;
  }).join('');

  // Question bars
  const qBars = d.questionStats.map(q=>{
    const col = q.pct>=60?'#E24B4A': q.pct>=30?'#BA7517':'#1D9E75';
    return `<div class="q-row">
      <div class="q-label">${q.label}</div>
      <div class="q-bar-wrap"><div class="q-bar" style="width:${q.pct}%;background:${col}"></div></div>
      <div class="q-pct">${q.pct}%</div>
    </div>`;
  }).join('');

  // Band breakdown
  const totalSubs = d.totalSubmissions || 1;
  const bandRows = d.bands.map(b=>{
    const pct=Math.round((b.count/totalSubs)*100);
    return `<div class="band-row">
      <div class="band-dot" style="background:${bandColor(b.band)}"></div>
      <div class="band-name">${b.band||'Unknown'}</div>
      <div class="band-bar-wrap"><div class="band-bar" style="width:${pct}%;background:${bandColor(b.band)}"></div></div>
      <div class="band-count">${b.count}</div>
      <div class="band-pct">${pct}%</div>
    </div>`;
  }).join('');

  // Recent submissions
  const recentRows = d.recent.map(r=>`<tr>
    <td>${r.id}</td>
    <td>${r.ip}</td>
    <td>${r.timestamp?.replace('T',' ').slice(0,16)||'—'}</td>
    <td style="font-weight:700;color:${r.total_score<=4?'#1D9E75':r.total_score<=9?'#BA7517':'#E24B4A'}">${r.total_score} / 15</td>
    <td><span class="badge ${bandBadge(r.band)}">${r.band?.split(' ').slice(0,2).join(' ')||'—'}</span></td>
  </tr>`).join('');

  document.getElementById('main-content').innerHTML = `

    <!-- STAT CARDS -->
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="stat-label">Total Visits</div>
        <div class="stat-value">${d.totalVisits.toLocaleString()}</div>
        <div class="stat-sub">${d.todayVisits} today</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Completions</div>
        <div class="stat-value">${d.totalSubmissions.toLocaleString()}</div>
        <div class="stat-sub">${d.todaySubmissions} today</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">Completion Rate</div>
        <div class="stat-value">${completion}%</div>
        <div class="stat-sub">visits → submissions</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Score</div>
        <div class="stat-value">${d.totalSubmissions>0 ? (d.scoreDist.reduce((s,r)=>s+r.total_score*r.count,0)/d.totalSubmissions).toFixed(1) : '—'}</div>
        <div class="stat-sub">out of 15 symptoms</div>
      </div>
    </div>

    <!-- TREND + BANDS -->
    <div class="grid2">
      <div class="card">
        <div class="section-title">Activity — Last 14 Days</div>
        ${makeTrendSVG(d.visitTrend, d.submitTrend)}
      </div>
      <div class="card">
        <div class="section-title">Result Band Breakdown</div>
        ${bandRows || '<div style="color:#6B8CAE;font-size:14px;padding:12px 0">No submissions yet.</div>'}
      </div>
    </div>

    <!-- QUESTION SYMPTOM RATES -->
    <div class="card" style="margin-bottom:24px">
      <div class="section-title">Symptom Frequency (% who answered Yes)</div>
      ${qBars || '<div style="color:#6B8CAE;font-size:14px;padding:12px 0">No data yet.</div>'}
    </div>

    <!-- SCORE DISTRIBUTION -->
    <div class="card" style="margin-bottom:24px">
      <div class="section-title">Score Distribution (0 – 15 symptoms)</div>
      <div style="display:flex;gap:12px;margin-bottom:8px">
        <span style="font-size:12px;color:#1D9E75;font-weight:600">■ 0–4 Flourishing</span>
        <span style="font-size:12px;color:#BA7517;font-weight:600">■ 5–9 Under Pressure</span>
        <span style="font-size:12px;color:#E24B4A;font-weight:600">■ 10–15 Needs Support</span>
      </div>
      <div class="score-bar-row">${scoreCols}</div>
    </div>

    <!-- RECENT SUBMISSIONS -->
    <div class="card">
      <div class="section-title">Recent Submissions (last 20)</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>IP Address</th><th>Date &amp; Time</th><th>Score</th><th>Band</th></tr></thead>
          <tbody>${recentRows || '<tr><td colspan="5" style="text-align:center;color:#6B8CAE;padding:24px">No submissions yet.</td></tr>'}</tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
