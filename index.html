
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;align-items:center;width:100%;padding:.75rem .75rem 1rem}
.top{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.back-btn{width:36px;height:36px;border-radius:50%;border:1px solid #B5D4F4;background:#E6F1FB;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#185FA5;font-size:18px;flex-shrink:0;visibility:hidden}
.back-btn.show{visibility:visible}
.prog-track{flex:1;height:5px;background:#E6F1FB;border-radius:10px;overflow:hidden}
.prog-fill{height:100%;background:#378ADD;border-radius:10px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.q-label{font-size:12px;color:#185FA5;min-width:38px;text-align:right;font-weight:500}
.deck-zone{position:relative;width:100%;height:100%;margin-bottom:.85rem}
.card{position:absolute;inset:0;background:#E6F1FB;border:1px solid #B5D4F4;border-radius:24px;display:flex;flex-direction:column;align-items:stretch;cursor:grab;user-select:none;touch-action:none;will-change:transform;overflow:hidden}
.card:active{cursor:grabbing}
.card.s1{transform:scale(0.95) translateY(10px);z-index:1;pointer-events:none}
.card.s2{transform:scale(0.9) translateY(20px);z-index:0;pointer-events:none}
.card.top{z-index:3}
.card-img{width:100%;height:185px;flex-shrink:0;overflow:hidden;border-radius:20px 20px 0 0}
.card-img svg{width:100%;height:100%;display:block}
.card-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.85rem 1.25rem .8rem;text-align:center;gap:8px;background:#fff}
.q-num{font-size:10px;color:#185FA5;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.q-text{font-size:15px;line-height:1.5;color:#042C53;font-weight:500}
.q-quote{font-size:11.5px;line-height:1.6;color:#378ADD;font-style:italic;border-top:1px solid #E6F1FB;padding-top:8px;width:100%}
.ov{position:absolute;inset:0;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;opacity:0;pointer-events:none;border:3px solid transparent;transition:opacity .08s;letter-spacing:.04em}
/* No = green (left swipe), Yes = red (right swipe) */
.ov-no{color:#0F7A58;border-color:#1D9E75;background:rgba(29,158,117,0.1)}
.ov-yes{color:#C93535;border-color:#E24B4A;background:rgba(226,75,74,0.1)}
.hint-row{display:flex;justify-content:space-between;width:100%;margin-bottom:.75rem;padding:0 2px}
.hint{font-size:12px;display:flex;align-items:center;gap:4px}
.hint-no{color:#0F7A58}
.hint-yes{color:#C93535}
.hint-mid{font-size:11px;color:#378ADD}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.act-btn{padding:16px 6px;border-radius:16px;border:2px solid;font-size:17px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:68px;justify-content:center;transition:transform .1s;letter-spacing:.03em}
.act-btn:active{transform:scale(0.96)}
.act-btn i{font-size:26px}
/* No = green, Yes = red */
.btn-no{background:#E1F5EE;border-color:#1D9E75;color:#0F7A58}
.btn-yes{background:#FCEBEB;border-color:#E24B4A;color:#C93535}
.btn-no:active{background:#9FE1CB}
.btn-yes:active{background:#F7C1C1}
.result{display:none;flex-direction:column;align-items:center;text-align:center;gap:.85rem;padding:.5rem 0 0;width:100%}
.score-wrap{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid}
.score-n{font-size:34px;font-weight:500;line-height:1}
.score-of{font-size:12px;color:#185FA5;margin-top:2px}
.band-pill{font-size:11px;padding:4px 14px;border-radius:20px;display:inline-block}
.band-name{font-size:20px;font-weight:500;color:#042C53}
.band-desc{font-size:14px;color:#185FA5;line-height:1.65;max-width:310px}
.actions{display:flex;flex-direction:column;gap:10px;width:100%}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;background:#25D366;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;width:100%;text-decoration:none}
.again-btn{padding:13px;background:#E6F1FB;color:#185FA5;border:1px solid #B5D4F4;border-radius:14px;font-size:14px;cursor:pointer;width:100%}
.disc{font-size:11px;color:#378ADD;line-height:1.6;max-width:310px;padding-bottom:.25rem}
</style>

<div class="app">

</div>

let cur=0,answers=[],dragging=false,sx=0,dx=0;

function render(){
  const q=Qs[cur];
  document.getElementById('qnum').textContent='Question '+(cur+1);
  document.getElementById('qtext').textContent=q.t;
  document.getElementById('qquote').textContent='\u201c'+q.q+'\u201d';
  document.getElementById('card-img').innerHTML=q.img;
  document.getElementById('qlabel').textContent=(cur+1)+' / 15';
  document.getElementById('prog').style.width=(cur/15*100)+'%';
  const bb=document.getElementById('back-btn');
  cur>0?bb.classList.add('show'):bb.classList.remove('show');
  document.getElementById('c1').style.opacity=cur+1<15?'1':'0';
  document.getElementById('c2').style.opacity=cur+2<15?'1':'0';
  resetCard();
}
function resetCard(){
  const c=document.getElementById('c0');
  c.style.transition='';c.style.transform='';c.style.opacity='1';
  document.getElementById('ov-no').style.opacity='0';
  document.getElementById('ov-yes').style.opacity='0';
}
function animSwipe(dir,cb){
  const c=document.getElementById('c0');
  const tx=dir==='left'?-430:430,rot=dir==='left'?-20:20;
  c.style.transition='transform .3s cubic-bezier(.4,0,.2,1),opacity .3s';
  c.style.transform='translateX('+tx+'px) rotate('+rot+'deg)';
  c.style.opacity='0';
  setTimeout(()=>{cb();render();},310);
}
function vote(v){
  if(cur>=15)return;
  answers.push({q:Qs[cur].t,vote:v,score:v});
  animSwipe(v===0?'left':'right',()=>{cur++;if(cur>=15)showResult();});
}
function goBack(){if(cur<=0)return;cur--;answers.pop();render();}

const c0=document.getElementById('c0');
c0.addEventListener('mousedown',e=>{dragging=true;sx=e.clientX;dx=0;},{passive:true});
c0.addEventListener('touchstart',e=>{dragging=true;sx=e.touches[0].clientX;dx=0;},{passive:true});
window.addEventListener('mousemove',e=>{if(!dragging)return;dx=e.clientX-sx;applyDrag(dx);},{passive:true});
c0.addEventListener('touchmove',e=>{if(!dragging)return;dx=e.touches[0].clientX-sx;applyDrag(dx);},{passive:true});
window.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;finishDrag();},{passive:true});
c0.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;finishDrag();},{passive:true});

function applyDrag(d){
  c0.style.transition='none';
  c0.style.transform='translateX('+d+'px) rotate('+(d*.07)+'deg)';
  const no=document.getElementById('ov-no'),yes=document.getElementById('ov-yes');
  if(d<-18){no.style.opacity=Math.min(1,Math.abs(d)/100)+'';yes.style.opacity='0';}
  else if(d>18){yes.style.opacity=Math.min(1,d/100)+'';no.style.opacity='0';}
  else{no.style.opacity='0';yes.style.opacity='0';}
}
function finishDrag(){
  if(Math.abs(dx)>85){vote(dx>0?1:0);}
  else{c0.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';c0.style.transform='';document.getElementById('ov-no').style.opacity='0';document.getElementById('ov-yes').style.opacity='0';}
  dx=0;
}

function bandInfo(t){
  if(t<=4)return{name:'Flourishing brain health',desc:"You're experiencing very few symptoms. Your mind is in a strong place — keep nurturing it.",color:'#1D9E75',bg:'#E1F5EE',range:'0–4'};
  if(t<=9)return{name:'Brain under pressure',desc:"You're noticing some challenges. Small, steady changes can make a meaningful difference.",color:'#BA7517',bg:'#FAEEDA',range:'5–9'};
  return{name:'Brain needs support',desc:"You're carrying a heavy load. Prioritise rest, connection, and support — you don't have to do this alone.",color:'#E24B4A',bg:'#FCEBEB',range:'10–15'};
}

function showResult(){
  document.getElementById('deck').style.display='none';
  document.getElementById('top').style.display='none';
  document.querySelectorAll('.hint-row,.btn-row').forEach(e=>e.style.display='none');
  const rs=document.getElementById('result');rs.style.display='flex';
  const total=answers.reduce((s,a)=>s+a.score,0);
  const b=bandInfo(total);
  document.getElementById('snum').textContent=total;
  document.getElementById('snum').style.color=b.color;
  const ring=document.getElementById('sring');ring.style.borderColor=b.color;ring.style.background=b.bg;
  const pill=document.getElementById('bpill');pill.textContent=b.range;pill.style.background=b.bg;pill.style.color=b.color;
  document.getElementById('bname').textContent=b.name;
  document.getElementById('bdesc').textContent=b.desc;
  buildPDF(total,b);
  document.getElementById('wa').href='https://wa.me/6589721049?text='+encodeURIComponent('My Brain Health Check-In\n\nSymptoms flagged: '+total+' / 15\n'+b.name+'\n\n'+b.desc+'\n\n(Brain Health Check-In)');
}

function buildPDF(total,b){
  try{
    const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210;
    doc.setFillColor(230,241,251);doc.rect(0,0,W,297,'F');
    doc.setFillColor(255,255,255);doc.roundedRect(15,15,180,267,6,6,'F');
    doc.setDrawColor(181,212,244);doc.setLineWidth(0.5);doc.roundedRect(15,15,180,267,6,6,'S');
    doc.setFontSize(9);doc.setTextColor(24,95,165);doc.text('BRAIN HEALTH CHECK-IN',W/2,30,{align:'center'});
    doc.setFontSize(22);doc.setFont('helvetica','bold');doc.setTextColor(4,44,83);doc.text('Brain Health Report',W/2,44,{align:'center'});
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(55,138,221);
    doc.text(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),W/2,51,{align:'center'});
    const rgb=b.color.replace('#','');
    const r=parseInt(rgb.substring(0,2),16),g=parseInt(rgb.substring(2,4),16),bv=parseInt(rgb.substring(4,6),16);
    const bgr=parseInt(b.bg.replace('#','').substring(0,2),16),bgg=parseInt(b.bg.replace('#','').substring(2,4),16),bgb=parseInt(b.bg.replace('#','').substring(4,6),16);
    doc.setFillColor(bgr,bgg,bgb);doc.roundedRect(60,60,90,55,8,8,'F');
    doc.setDrawColor(r,g,bv);doc.setLineWidth(1);doc.roundedRect(60,60,90,55,8,8,'S');
    doc.setFontSize(40);doc.setFont('helvetica','bold');doc.setTextColor(r,g,bv);doc.text(''+total,W/2,90,{align:'center'});
    doc.setFontSize(12);doc.setTextColor(24,95,165);doc.text('symptoms flagged / 15',W/2,100,{align:'center'});
    doc.setFillColor(r,g,bv);doc.roundedRect(65,113,80,10,5,5,'F');
    doc.setFontSize(9);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.text(b.range,W/2,120,{align:'center'});
    doc.setFontSize(14);doc.setTextColor(4,44,83);doc.text(b.name,W/2,134,{align:'center'});
    doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(24,95,165);
    doc.text(doc.splitTextToSize(b.desc,150),W/2,144,{align:'center'});
    let y=164;
    doc.setFillColor(230,241,251);doc.rect(25,y-6,160,8,'F');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(24,95,165);
    doc.text('QUESTION',30,y);doc.text('ANSWER',178,y,{align:'right'});
    y+=8;
    answers.forEach((a,i)=>{
      if(i%2===0){doc.setFillColor(240,248,255);doc.rect(25,y-4,160,7,'F');}
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(4,44,83);
      doc.text(doc.splitTextToSize((i+1)+'. '+a.q,128)[0],30,y);
      const ans=a.vote===1?'Yes':'No';
      // Yes = red (symptom), No = green (no symptom)
      const ar=a.vote===1?226:29,ag=a.vote===1?75:158,ab=a.vote===1?74:117;
      doc.setTextColor(ar,ag,ab);doc.setFont('helvetica','bold');doc.text(ans,178,y,{align:'right'});
      y+=7;
    });
    doc.setDrawColor(181,212,244);doc.setLineWidth(0.3);doc.line(25,y+2,185,y+2);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(4,44,83);doc.text('Symptoms flagged',30,y+8);
    doc.setTextColor(r,g,bv);doc.text(total+' / 15',188,y+8,{align:'right'});
    doc.setFontSize(7.5);doc.setFont('helvetica','italic');doc.setTextColor(55,138,221);
    doc.text(doc.splitTextToSize('A personal reflection tool — not a medical or diagnostic assessment. If anything concerns you, speak with a qualified professional.',160),W/2,272,{align:'center'});
    doc.save('brain-health-report.pdf');
  }catch(e){console.error(e);}
}

function retake(){
  cur=0;answers=[];
  document.getElementById('result').style.display='none';
  document.getElementById('deck').style.display='';
  document.getElementById('top').style.display='';
  document.querySelectorAll('.hint-row,.btn-row').forEach(e=>e.style.display='');
  render();
}
render();
</script>
